<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) work (bottom nav, notch). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>
      TeachForFree — Behavior tracking &amp; lesson notes for teachers
    </title>
    <meta
      name="description"
      content="Free classroom tools for teachers: tap a student to give a positive or negative behavior mark, and keep short lesson notes on your phone while you teach."
    />
    <meta name="theme-color" content="#f7f9f3" />
    <link rel="canonical" href="https://teachforfree.com/" />

    <!-- Installed app (home screen). The manifest link is added at build time
         by vite-plugin-pwa (see vite.config.ts). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeachForFree" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Icons: the apple from the logo. `npm run generate-pwa-assets` writes
         them to public/branding/ (see pwa-assets.config.ts). -->
    <link rel="icon" href="/branding/favicon.ico" sizes="48x48" />
    <link
      rel="apple-touch-icon"
      href="/branding/apple-touch-icon-180x180.png"
    />

    <!-- iPhone launch screens: the full logo, made by
         scripts/generate-branding.mjs. Don't add "and (device-height: …px)"
         to these media queries: iOS 27 reads Safari's window height for it,
         nothing matches, and the app opens on a black screen (WebKit bug
         326500). Width + pixel ratio is still unique for every size below. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2868x1320.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1290x2796.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2796x1290.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1284x2778.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2778x1284.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1260x2736.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2736x1260.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1242x2688.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"

    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1206x2622.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2622x1206.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1179x2556.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2556x1179.png"
    />
    <link
      rel="apple-touch-startup-image"

      href="/branding/apple-splash-portrait-1170x2532.png"
    />
    <link

      media="screen and (device-width: 390px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2532x1170.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-1125x2436.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-2436x1125.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"

    />
    <link

      media="screen and (device-width: 414px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-1792x828.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/branding/apple-splash-portrait-750x1334.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
      href="/branding/apple-splash-landscape-1334x750.png"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teachforfree.com/" />
    <meta property="og:site_name" content="TeachForFree" />
    <meta
      property="og:title"
      content="TeachForFree — Behavior tracking &amp; lesson notes for teachers"
    />
    <meta
      property="og:description"
      content="Free classroom tools for teachers: tap a student to give a positive or negative behavior mark, and keep short lesson notes on your phone while you teach."
    />
    <!-- Picture shown when a link is shared (scripts/generate-branding.mjs). -->
    <meta
      property="og:image"
      content="https://teachforfree.com/branding/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TeachForFree logo" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts named in src/styles.css (--font-sans, --font-mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- Dark mode, if the teacher turned it on (src/components/theme-provider.tsx).
         Runs before the page paints, so it doesn't flash light first. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#000000')
        }
      } catch (e) {}
    </script>

    <!-- Chrome/Edge can offer "install" before the app's code has loaded.
         Keep that offer for the "Download the app" button (src/lib/pwa-install.ts). -->
    <script>
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__tffInstallPrompt = e
      })
    </script>

    <!-- Launch screen for the installed app only (never on the website). It
         continues the phone's own launch screen while the app loads and
         checks the sign-in, then fades out (src/lib/splash.ts). The logo is
         the same size and place as on the iPhone launch images
         (scripts/generate-branding.mjs), on the light background. -->
    <style>
      #splash {
        display: none;
      }
      @media (display-mode: standalone) {
        #splash {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: grid;
          place-items: center;
          background: #f7f9f3;
          transition: opacity 0.2s ease-out;
        }
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: calc(min(100vw, 100vh) * 0.6);
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Outside #app on purpose: main.tsx only renders into an empty #app. -->
    <div id="splash" aria-hidden="true">
      <img
        src="/branding/teachforfree-apple-light.png"
        alt=""
        width="804"
        height="192"
      />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
