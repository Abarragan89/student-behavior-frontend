<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) work (bottom nav, notch). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>
      TeachForFree — Behavior tracking &amp; lesson notes for teachers
    </title>
    <meta
      name="description"
      content="Free classroom tools for teachers: tap a student to give a positive or negative behavior mark, and keep short lesson notes on your phone while you teach."
    />
    <meta name="theme-color" content="#f7f9f3" />
    <link rel="canonical" href="https://teachforfree.com/" />

    <!-- Installed app (home screen). The manifest link is added at build time
         by vite-plugin-pwa (see vite.config.ts). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TeachForFree" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Icons: generated by `npm run generate-pwa-assets` from public/app-icon.svg. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iPhone launch screens (also generated). The generator adds
         "and (device-height: …px)" to each media query; it's removed here
         because iOS 27 reads Safari's window height for it, nothing matches,
         and the app opens on a black screen (WebKit bug 326500). Width + pixel
         ratio is still unique for every size below. Keep it out when
         regenerating. -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/apple-splash-portrait-1320x2868.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"

    <!-- Fonts named in src/styles.css (--font-sans, --font-mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- Chrome/Edge can offer "install" before the app's code has loaded.
         Keep that offer for the "Download the app" button (src/lib/pwa-install.ts). -->
    <script>
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__tffInstallPrompt = e
      })
    </script>

    <!-- Launch screen for the installed app only (never on the website). It
         continues the phone's own launch screen while the app loads and
         checks the sign-in, then fades out (src/lib/splash.ts). The plus is
         the same size and place as on the iPhone launch images. -->
    <style>
      #splash {
        display: none;
      }
      @media (display-mode: standalone) {
        #splash {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: grid;
          place-items: center;
          background: #4f46e5;
          transition: opacity 0.2s ease-out;
        }
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: calc(min(100vw, 100vh) * 0.4);
      }
      #splash p {
        position: absolute;
        inset-inline: 0;
        top: calc(50% + min(100vw, 100vh) * 0.13);
        margin: 0;
        text-align: center;
        color: #fff;
        font:
          700 1.5rem/1 'DM Sans',
          system-ui,
          sans-serif;
        animation: splash-in 0.3s 0.15s both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash p {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Outside #app on purpose: main.tsx only renders into an empty #app. -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512">
        <path
          d="M256 160v192M160 256h192"
          stroke="#fff"
          stroke-width="56"
          stroke-linecap="round"
        />
      </svg>
      <p>TeachForFree</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
