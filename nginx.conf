# dist/ holds two builds side by side (see `npm run build`):
# - the marketing pages from site/ (Astro): index.html, privacy.html, …,
#   /_astro/, robots.txt and the sitemap. Plain HTML for search engines.
# - the app from src/ (Vite): app.html, /assets/, sw.js, manifest.webmanifest.
# A URL gets its page's .html file if the site built one (/privacy →
# privacy.html), and the app otherwise (/classes, /lesson-plans/…).

# Fingerprinted files (/assets/, /_astro/) are kept forever once found. A
# missing one is never kept: during a deploy the old server answers for a new
# file for a moment, and Cloudflare would keep that 404 for 3 minutes.
map $status $fingerprinted_cache_control {
    ~^(?:200|206|304)$ "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects nginx makes itself (e.g. adding a slash) stay relative, so
    # they don't point at http://…:3000 behind Cloudflare.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    # The installable-app manifest. nginx's built-in types don't know
    # .webmanifest, and browsers should always fetch the latest one.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fingerprinted files (the app's /assets, the site's /_astro): see the
    # map above.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $fingerprinted_cache_control always;
        add_header X-Content-Type-Options "nosniff";
    }
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control $fingerprinted_cache_control always;
        add_header X-Content-Type-Options "nosniff";
    }
    # The app's page as the service worker saves it (APP_SHELL in
    # vite.config.ts): a copy of app.html under a name only one build has.
    # The worker opens every app page with it, so it gets app.html's headers.
    # A regex location, so it wins over /assets/ above.
    location ~ ^/assets/app-shell-[0-9a-f]+\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The app. Every app URL ends up here through the fallback below (an
    # internal redirect, so these headers apply). Search engines must not
    # list app pages: they have no content until a teacher signs in, and
    # unknown URLs land here too.
    location = /app.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # Otherwise /app would serve app.html below, without the noindex.
    location = /app {
        return 404;
    }

    # no-cache: pages and sw.js are checked on every visit, so a deploy
    # reaches visitors and installed phones right away.
    location / {
        try_files $uri $uri.html $uri/ /app.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
